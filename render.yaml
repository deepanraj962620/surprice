services:
  - type: web
    name: buji-hdb-backend
    env: node
    buildCommand: cd backend && npm install && npm rebuild sqlite3 --build-from-source || true
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: "*"
